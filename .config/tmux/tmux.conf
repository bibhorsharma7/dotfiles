# For colors
set -ga terminal-overrides ',*:Tc'

set -g mouse on

# Prefix key
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Alt+Shift h/l to move between windows
bind -n M-H previous-window
bind -n M-L next-window

# Alt+Shift j/k to move between sessions
bind -n M-K switch-client -p -O index
bind -n M-J switch-client -n -O index

# For shift+enter
set -g extended-keys on
set -g extended-keys-format csi-u

# 1 based index
set -g base-index 1
set-option -g renumber-windows on

set-option -g detach-on-destroy off

# Vim keys
set-window-option -g mode-keys vi
# pane switching (dont switch to the sidebar)
bind -r h run-shell '~/.local/bin/tmux-sidebar nav L "#{window_id}"'
bind -r j run-shell '~/.local/bin/tmux-sidebar nav D "#{window_id}"'
bind -r k run-shell '~/.local/bin/tmux-sidebar nav U "#{window_id}"'
bind -r l run-shell '~/.local/bin/tmux-sidebar nav R "#{window_id}"'

# Copy mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Resize to even sizes
bind E run-shell '~/.local/bin/tmux-sidebar even "#{window_id}"'

# Floating notes window: a session on its own server, so session switching never reaches it
bind n if -F '#{==:#{session_name},float}' 'detach-client' 'display-popup -E -w 40% -h 80% "TMUX= tmux -L float new-session -A -s float nvim ~/Documents/notes.txt"'
set-hook -g session-created {
    if -F "#{==:#{session_name},float}" {
        set status off
        set detach-on-destroy on
    } {
        run-shell -b '~/.local/bin/tmux-sidebar add "#{window_id}"'
    }
}

# Open panes & windows in current directory
bind c new-window -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"

# Sessionizer
bind f display-popup -E -w 60% -h 60% "~/.local/bin/tmux-sessionizer"

# Git worktrees
bind t display-popup -E -w 60% -h 50% -d "#{pane_current_path}" "~/.local/bin/tmux-worktree"

# Agent sidebar, with states set by the tmux-agent-state hook
if -F '#{==:#{@sidebar_enabled},}' 'set -g @sidebar_enabled 1'
bind a run-shell '~/.local/bin/tmux-sidebar focus "#{window_id}"'
bind A run-shell '~/.local/bin/tmux-sidebar toggle'
set-hook -g after-new-window 'run-shell -b "~/.local/bin/tmux-sidebar add #{window_id}"'
set-hook -g pane-exited 'run-shell -b "~/.local/bin/tmux-sidebar tidy"'
set-hook -g after-kill-pane 'run-shell -b "~/.local/bin/tmux-sidebar tidy"'
set-hook -g window-resized 'run-shell -b "~/.local/bin/tmux-sidebar tidy"'
set-hook -g window-layout-changed 'run-shell -b "~/.local/bin/tmux-sidebar tidy"'
set-hook -g session-window-changed 'run-shell -b "~/.local/bin/tmux-sidebar wake"'
set-hook -g client-session-changed 'run-shell -b "~/.local/bin/tmux-sidebar wake"'
run-shell -b '~/.local/bin/tmux-sidebar sync'

# Pane labels
set -g pane-border-lines heavy
set -g pane-border-status bottom
set -g pane-border-format '#{?pane_active,#[fg=#191724 bg=#f6c177 bold],#{?#{&&:#{==:#{@agent_state},waiting},#{&&:#{@agent_kind},#{m/r:^(claude|pi)$,#{pane_current_command}}}},#[fg=#eb6f92 bold],#[fg=#908caa]}} #{pane_index} #{?#{@sidebar},agents,#{?#{&&:#{@agent_kind},#{m/r:^(claude|pi)$,#{pane_current_command}}},#{@agent_kind} #{@agent_state},#{pane_current_command}}} #[default]'

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Status bar: a centered window list, with a tmux icon that turns gold while the prefix is active
set -g status-justify absolute-centre
set -g status-style 'bg=default,fg=#6e6a86'
set -g status-left ''
set -g window-status-separator ' • '
set -g window-status-format '#{?window_start_flag,#{?client_prefix,#[fg=#f6c177],#[fg=#6e6a86]} #[default],} #W '
set -g window-status-current-format '#{?window_start_flag,#{?client_prefix,#[fg=#f6c177],#[fg=#6e6a86]} #[default],}#[fg=#e0def4] #W #[fg=#9ccfd8]#{?window_zoomed_flag,󰊓 ,}'

# continuum autosaves from a status bar call, and it adds that call only when no other tmux
# server runs. The call prints nothing, so the right side stays empty.
set -g status-right "#($HOME/.config/tmux/plugins/tmux-continuum/scripts/continuum_save.sh)"
set -g pane-border-style 'fg=#524f67'
set -g pane-active-border-style 'fg=#f6c177'
set -g message-style 'fg=#6e6a86,bg=default'
set -g mode-style 'bg=#403d52'

# Session restore after reboot
set -g @continuum-restore 'off'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-hook-post-save-layout '~/.local/bin/tmux-agent-state --sort'
set -g @resurrect-hook-post-save-all '~/.local/bin/tmux-agent-state --save'
set -g @resurrect-hook-pre-restore-all 'tmux set -g @sidebar_enabled 0'
set -g @resurrect-hook-post-restore-all '~/.local/bin/tmux-sidebar restore; ~/.local/bin/tmux-agent-state --restore'

# Only save and restore for default server
%if "#{!=:#{b:socket_path},default}"
  set -g @continuum-save-interval '0'
%endif

# Restore once at server start. continuum's own restore skips while the float server runs.
# The continuum timestamp stops an instant autosave that would replace the save with this empty server.
# Sidebars wait, because resurrect replaces the startup session only when the server has a single pane.
%if "#{&&:#{==:#{b:socket_path},default},#{==:#{@restore_done},}}"
  set -g @restore_done 1
  set -g @sidebar_enabled 0
  run-shell -b 'tmux set -g @continuum-save-last-timestamp "$(date +%s)"; sleep 1; ~/.config/tmux/plugins/tmux-resurrect/scripts/restore.sh; tmux set -g @sidebar_enabled 1; ~/.local/bin/tmux-sidebar sync'
%endif

run '~/.config/tmux/plugins/tpm/tpm'
